name: repository-ci

# CI is intentionally limited to validation and tests. Production deployment,
# credentials, and Unity licensing remain separate approval-gated work.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Detect optional modules before installing toolchains. This keeps an
      # early repository shell fast while making skipped work explicit.
      - name: Detect repository layout
        id: layout
        shell: bash
        run: |
          if [[ -f scripts/validate_content.py ]]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f scripts/ci/p07.sh ]]; then
            echo "has_p07=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_p07=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f scripts/ci/p08.sh ]]; then
            echo "has_p08=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_p08=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f scripts/ci/p09.sh ]]; then
            echo "has_p09=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_p09=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f scripts/ci/p10.sh ]]; then
            echo "has_p10=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_p10=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f gradlew || -f server-api/gradlew ]]; then
            echo "has_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_server=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.layout.outputs.has_content == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        if: steps.layout.outputs.has_server == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The same script is executable locally, so CI behavior does not live
      # only inside YAML that developers cannot reproduce.
      - name: Run repository CI contract
        shell: bash
        run: scripts/ci/run-ci.sh

      - name: Upload server test reports
        if: always() && steps.layout.outputs.has_server == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results-${{ github.run_id }}
          path: "**/build/test-results/test/*.xml"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload P07 contract evidence
        if: always() && steps.layout.outputs.has_p07 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p07-contract-evidence-${{ github.run_id }}
          path: |
            docs/reports/captures/P07/*.png
            client-unity/Assets/KingdomTycoon/Resources/Contracts/p07-*.json
            client-unity/Assets/KingdomTycoon/Resources/Contracts/save.content.5.schema.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload P08 contract evidence
        if: always() && steps.layout.outputs.has_p08 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p08-contract-evidence-${{ github.run_id }}
          path: |
            docs/reports/captures/P08/*.png
            docs/goldens/P08/*.json
            client-unity/Assets/KingdomTycoon/Resources/Contracts/p08-new-game.template.json
            client-unity/Assets/KingdomTycoon/Resources/Contracts/save.content.6.schema.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload P09 contract evidence
        if: always() && steps.layout.outputs.has_p09 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p09-contract-evidence-${{ github.run_id }}
          path: |
            docs/reports/captures/P09/*.png
            docs/goldens/P09/*.json
            client-unity/Assets/KingdomTycoon/Resources/Contracts/p09-new-game.template.json
            client-unity/Assets/KingdomTycoon/Resources/Contracts/save.content.7.schema.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload P10 contract evidence
        if: always() && steps.layout.outputs.has_p10 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p10-contract-evidence-${{ github.run_id }}
          path: |
            docs/reports/captures/P10/*.png
            docs/goldens/P10/*.json
            client-unity/Assets/KingdomTycoon/Resources/Contracts/p10-new-game.template.json
            client-unity/Assets/KingdomTycoon/Resources/Contracts/save.content.8.schema.json
          if-no-files-found: error
          retention-days: 14
